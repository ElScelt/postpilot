version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom"]
      dev:
        dependency-type: development
    ignore:
      # eslint-config-next's plugins do not yet accept ESLint 10 or TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # The types follow the Node.js the project runs on (22 in .nvmrc and CI); a newer
      # major would type-check calls that do not exist at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
